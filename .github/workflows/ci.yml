name: Verify local control platform
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: controls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_owner"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.19', python-version: '3.12'}
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check app tests
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test_owner:test-only-password@localhost:5432/postgres
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck && npm run test:unit && npm run build
        working-directory: frontend
        env: {NEXT_TELEMETRY_DISABLED: '1'}
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 240
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker compose restart api && docker compose up -d --wait --wait-timeout 60 api
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: browser-evidence, path: 'frontend/test-results', retention-days: 7}
